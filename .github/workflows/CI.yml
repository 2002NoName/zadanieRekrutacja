name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    quality-gate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
              working-directory: frontend
            - run: npm run lint
              working-directory: frontend
            - run: npm run build
              working-directory: frontend
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - run: npm ci
              working-directory: backend
            - run: npm run lint
              working-directory: backend
            - run: npm run build
              working-directory: backend

    dependency-audit:
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
              working-directory: frontend
            - run: npm audit --audit-level=high
              working-directory: frontend
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - run: npm ci
              working-directory: backend
            - run: npm audit --audit-level=high
              working-directory: backend

    secret-scan:
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    codeql:
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        name: CodeQL analysis
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v5
            - uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  build-mode: none
            - uses: github/codeql-action/analyze@v4
              with:
                  category: /language:javascript-typescript

    image-build-sign:
        needs: [quality-gate, dependency-audit, secret-scan, codeql]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v5
            - uses: docker/setup-buildx-action@v3
            - uses: sigstore/cosign-installer@v3
            - uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  tags: crud-api:${{ github.sha }}
                  outputs: type=oci,dest=/tmp/crud-api.tar
            - uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  tags: crud-frontend:${{ github.sha }}
                  outputs: type=oci,dest=/tmp/crud-frontend.tar
            - run: cosign sign-blob --yes --bundle /tmp/crud-api.bundle /tmp/crud-api.tar
            - run: cosign sign-blob --yes --bundle /tmp/crud-frontend.bundle /tmp/crud-frontend.tar
            - uses: actions/upload-artifact@v4
              with:
                  name: signed-container-images-${{ github.sha }}
                  path: |
                      /tmp/crud-api.tar
                      /tmp/crud-api.bundle
                      /tmp/crud-frontend.tar
                      /tmp/crud-frontend.bundle
                  retention-days: 14
